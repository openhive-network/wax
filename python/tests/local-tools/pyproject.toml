[build-system]
requires = ["poetry-core==2.1.3"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
requires-poetry = "2.1.3"
name = "local-tools"
version = "0.0.0"
description = "Tools shared by tests in wax and test-tools projects"
authors = []
repository = "https://gitlab.syncad.com/hive/wax"
packages = [
    { include = "local_tools" },
]
source = [
    { name = "PyPI", priority = "primary" },
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary" },
]


[tool.poetry.dependencies]
python = ">=3.12,<4"
hiveio-wax = { path = "../../wax", develop = true }
hiveio-test-tools = { path = "../../test_tools", develop = true }


[tool.poetry.group.static-analysis.dependencies]
mypy = "^1.11.2"
ruff = "^0.6.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-xdist = "^3.6.1"
