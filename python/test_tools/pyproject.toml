[build-system]
requires = [
    "poetry-core==2.1.3",
    "poetry-dynamic-versioning==1.9.1",
]
build-backend = "poetry_dynamic_versioning.backend"


[tool.poetry]
requires-poetry = "2.1.3"
name = "hiveio-test-tools"
version = "0.0.0"
description = "Tools for testing hive software"
authors = ["Piotr Batko <pbatko@syncad.com>"]
readme = "readme.md"
repository = "https://gitlab.syncad.com/hive/wax"
source = [
    { name = "PyPI", priority = "primary" },
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary" },
]
packages = [
    { include = "test_tools" },
]

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = "1.9.1", extras = ["plugin"] }

[tool.poetry.dependencies]
python = ">=3.12,<4"
python-dateutil = "^2.8.2"
abstractcp = "^1.0.0"
msgspec = "^0.20.0"
loguru = "^0.7.2"
hiveio-wax = { path = "../wax", develop = true }
hiveio-beekeepy = "^1.28.6-post.0"
hiveio-schemas = "^1.28.2-post.0"
hiveio-api = ">=1.28.8rc12.dev0"


[tool.poetry.group.static-analysis.dependencies]
mypy = "^1.11.2"
pre-commit = "^4.0.0"
ruff = "^0.6.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-xdist = "^3.6.1"


[tool.poetry-dynamic-versioning]
enable = true
pattern = '''v?(?P<base>\d+\.\d+\.\d+)\-?(?:(?P<stage>[a-zA-Z0-9]+)(?P<revision>\d+))?$'''
# PEP 440 compliant versioning
# https://peps.python.org/pep-0440/
#
# Version examples (assuming last tag is 1.2.3rc1):
#   Tag (distance=0, clean):       1.2.3rc1
#   Tag (distance=0, dirty):       1.2.3rc1+dirty
#   develop (distance>0):          1.2.3rc1.post20260129082556
#   develop (dirty):               1.2.3rc1.post20260129082556+dirty
#   feature branch (distance>0):   1.2.3rc1.dev20260129082556
#   feature branch (dirty):        1.2.3rc1.dev20260129082556+dirty
#   feature branch (distance=0):   1.2.3rc1  (same as tag)
#
# Logic:
#   - distance=0           -> exact tag version
#   - distance>0, stable   -> tag + .post{timestamp} (post-release, after tag)
#   - distance>0, unstable -> tag + .dev{timestamp} (pre-release, before tag)
#   - dirty (suppressed in CI) -> + 'dirty' marker
#
# Stability detection:
#   - stable: develop/master/main branches OR tag checkout (detached HEAD with distance=0)
#   - unstable: feature branches OR detached HEAD with distance>0
#   - CI: GitLab checks out as detached HEAD, so branch is None;
#     use CI_COMMIT_REF_NAME env var as fallback for branch detection
#
# Version ordering (newest last):
#   1.2.3rc1.dev20260129082556 < 1.2.3rc1 < 1.2.3rc1.post20260129082556
#   (feature branch, before tag)   (tag)      (develop, after tag)
#
# pip/poetry behavior:
#   - `poetry update` / `pip install pkg>=1.0` -> selects stable only (ignores .dev pre-releases)
#   - `pip install --pre` / `allow-prereleases = true` -> includes feature branches
#   - Feature branch versions are ALWAYS lower than the tag, providing double protection:
#     1. pre-release filtering (default) 2. numerically lower version
format-jinja = """
    {%- set STABLE_BRANCHES = ['develop', 'master', 'main'] -%}

    {%- set effective_branch = branch or env.get('CI_COMMIT_REF_NAME') -%}
    {%- set is_ci = env.get('CI') == 'true' -%}
    {%- set is_on_tag = distance == 0 -%}
    {%- set is_after_tag = distance > 0 -%}
    {%- set is_tag_checkout = branch is none and is_on_tag -%}
    {%- set is_stable = effective_branch in STABLE_BRANCHES or is_tag_checkout -%}
    {%- set is_feature_branch = is_after_tag and not is_stable -%}

    {%- set post = timestamp|int if is_after_tag and not is_feature_branch else none -%}
    {%- set dev = timestamp|int if is_feature_branch else none -%}
    {%- set local_parts = [] -%}
    {%- set local_parts = local_parts + ['dirty'] if dirty and not is_ci else local_parts -%}

    {{ serialize_pep440(base, stage, revision, post=post, dev=dev, metadata=local_parts) }}
"""

[tool.poetry-dynamic-versioning.substitution]
files = ["test_tools/__init__.py"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "F",
    "E",
    "W",
    "C",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ASYNC",
    "BLE",
    "B",
    "A",
    "C4",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "TRY",
    "FLY",
    "RUF",
]
ignore = [
    "E501", # line too long, handled by ruff format
    "D203", # 1 blank line required before class docstring; because we re using D211
    "D212", # Multi-line docstring summary should start at the first line; because we re using D213
    "D401", # first line should be in imperative mood
    "PT004", # fixture does not return anything, add leading underscore;  issue: pytest seems to ignore (not launch) auto-use fixtures with leading underscode

    "TRY003", # too restrictive
    "PLR0913", # too restrictive, too many arguments to function call

    "D104", # missing docstring in public package
    "D100", # missing docstring in public module
]

[tool.ruff.lint.per-file-ignores]
"test_tools/__private/hived/api/**" = [
    "TCH001", # API response models cannot be placed in the type checking block
    "TCH002", # API response models cannot be placed in the type checking block
]
"tests/**" = [
    "D1",  # Missing docstrings — not required in tests
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
known-first-party = ["helpy", "schemas", "wax", "test_tools"]
required-imports = ["from __future__ import annotations"]


[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "requires_hived_executables: these tests require defined paths to binaries: hived, cli_wallet, get_dev_key and compress_block_log",
]


[tool.mypy]
strict = true
disallow_untyped_decorators = false
allow_any_generics = true
