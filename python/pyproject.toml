[build-system]
requires = [
    "poetry-core>=1.1.0",
    "cython==3.0.12",
    "setuptools>=67.8.0",
    "poetry-dynamic-versioning>=0.22.0"
]
build-backend = "poetry_dynamic_versioning.backend"


[tool.poetry]
requires-poetry = "2.1.3"
name = "hiveio-wax"
version = "0.0.0"
description = ""
repository = "https://gitlab.syncad.com/hive/wax"
authors = []
packages = [{ include = "wax"}]
include = [
    "wax/_private/proto/*",
    "wax/*.so",
]
source = [
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary" },
]

[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.poetry.dependencies]
python = ">=3.12,<4"
protobuf = ">=6.33.0"
httpx = {extras = ["http2"], version = ">=0.23.3"}
loguru = ">=0.7.2"
python-dateutil = ">=2.8.2"
requests = ">=2.32.3"
typing-extensions = ">=4.0.0"
hiveio-api = ">=1.28.5"
hiveio-beekeepy = ">=1.28.5"

[tool.poetry.group.static-analysis.dependencies]
mypy = ">=1.11.2"
mypy-protobuf = ">=3.5.0"
pre-commit = ">=2.21.0"
ruff = ">=0.11.5"
types-setuptools = ">=67.8.0"
types-python-dateutil = ">=2.8.19.14"
types-protobuf = ">=5.29.1.20241207"
grpc-stubs = ">=1.53.0.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.5"
pytest-asyncio = ">=0.25.3"
pytest-xdist = ">=3.6.1"
grpcio = ">=1.76.0"
grpcio-tools = ">=1.76.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.1"
mkdocstrings-python = ">=1.16.11"
mkdocs-material = ">=9.6.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poetry-dynamic-versioning]
enable = true
pattern = '''v?(?P<base>\d+\.\d+\.\d+)\-?(?:(?P<stage>[a-zA-Z0-9]+)(?P<revision>\d+))?$'''
# PEP 440 compliant versioning with .post{timestamp}
# https://peps.python.org/pep-0440/
#
# Pattern matches only `beekeeper-v` prefixed tags (e.g. beekeeper-v1.0.0),
# ignoring native C++ tags like `1.28.6-alpha`.
#
# Version examples (assuming last tag is beekeeper-v1.28.5):
#   Tag (distance=0, clean):       1.28.5
#   Tag (distance=0, dirty):       1.28.5+dirty
#   master (distance>0):           1.28.5.post20260130132734
#   master (dirty):                1.28.5.post20260130132734+dirty
#   feature branch (distance>0):   1.28.5.post20260130132734.dev0+unstable
#   feature branch (dirty):        1.28.5.post20260130132734.dev0+unstable.dirty
#   feature branch (distance=0):   1.28.5  (same as tag)
#
# Pre-release tag (e.g. beekeeper-v1.28.5rc1):
#   Tag (distance=0):              1.28.5rc1
#   master (distance>0):           1.28.5rc1.post20260130132734
#   feature branch (distance>0):   1.28.5rc1.post20260130132734.dev0+unstable
#
# Logic:
#   - distance=0         -> exact tag version
#   - distance>0, stable -> tag + .post{timestamp}
#   - distance>0, unstable -> tag + .post{timestamp}.dev0+unstable (pre-release, ignored by default)
#   - dirty (local only) -> + 'dirty' marker (disabled in CI)
#   - unstable           -> + 'unstable' marker
#
# Stability detection:
#   - stable: develop/master/main branches OR tag checkout (detached HEAD with distance=0)
#   - unstable: feature branches OR detached HEAD with distance>0
#   - CI: GitLab checks out as detached HEAD, so branch is None;
#     use CI_COMMIT_REF_NAME env var as fallback for branch detection
#
# Version ordering (newest last):
#   1.28.5 < 1.28.5.post20260130132734 < 1.28.5.post20260130133000.dev0+unstable < 1.28.5.post20260130133000
#   (tag)    (master)                    (feature, newer timestamp)                (master, same timestamp)
#
# pip/poetry behavior:
#   - `poetry update` / `pip install pkg>=1.0` -> selects stable only (ignores .dev0)
#   - `pip install --pre` / `allow-prereleases = true` -> includes feature branches
format-jinja = """
    {%- set STABLE_BRANCHES = ['develop', 'master', 'main'] -%}

    {%- set effective_branch = branch or env.get('CI_COMMIT_REF_NAME') -%}
    {%- set is_ci = env.get('CI') == 'true' -%}
    {%- set is_on_tag = distance == 0 -%}
    {%- set is_after_tag = distance > 0 -%}
    {%- set is_tag_checkout = branch is none and is_on_tag -%}
    {%- set is_stable = effective_branch in STABLE_BRANCHES or is_tag_checkout -%}
    {%- set is_feature_branch = is_after_tag and not is_stable -%}

    {%- set post = timestamp|int if is_after_tag else none -%}
    {%- set dev = 0 if is_feature_branch else none -%}
    {%- set local_parts = ['unstable'] if is_feature_branch else [] -%}
    {%- set local_parts = local_parts + ['dirty'] if dirty and not is_ci else local_parts -%}

    {{ serialize_pep440(base, stage, revision, post=post, dev=dev, metadata=local_parts) }}
"""

[tool.poetry-dynamic-versioning.substitution]
files = [
    "wax/__init__.py",
]

[tool.mypy]
mypy_path = "python"
strict = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "wax._private.proto.*"
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "wax.proto.*"
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "wax._private.api.api_caller"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "helpy",
    "helpy.*",
    "local_tools.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["ALL"]
ignore = [
    "D1", # missing docstring in public
    "D203", # 1 blank line required before class docstring; because we re using D211
    "D212", # Multi-line docstring summary should start at the first line; because we re using D213
    "D401", # First line of docstring should be in imperative mood
    "D413", # Missing blank line after last section
    "TRY003", # Avoid specifying long messages outside the exception class; too restrictive
    "ANN101",  # Missing annotation for self; makes no sense
    "ANN102",  # Missing annotation for cls; makes no sense
    "TD002", # Missing author in to-do; no need for that
    "TD003",  # Missing issue link on the line following this to-do; no need for that
    "SLF001",  # Private member accessed: {access}; too restrictive
    "COM812", # Trailing comma missing; handled by ruff formatter
    "EM",  # agreed not to use it in our convention
    "FIX", # can't have that enabled, as we treat ruff result as an error on CI
    "S101",  # Use of assert detected; too restrictive
    "S311", # Standard pseudo-random generator are not suitable for cryptographic purposes; mostly used in tests
    "S603", # `subprocess` call: check for execution of untrusted input; https://github.com/astral-sh/ruff/issues/4045
    "ISC001", # Implicitly concatenated string literals on one line; disabled because conflicts with ruff formatter
    "PLR2004", # Ignore "magic value used in comparison" warnings; explicit constants not always necessary in tests
]

[tool.ruff.lint.per-file-ignores]
"**/sync_api.py" = [
  "PLR0913", # api definitions can have as many arguments as they need
  "FBT001", # api definitions have own argument restrictions
  "FBT002", # api definitions have own argument restrictions
  "TCH001",
  "TCH002",
]
"**/async_api.py" = [
  "PLR0913", # api definitions can have as many arguments as they need
  "FBT001", # api definitions have own argument restrictions
  "FBT002", # api definitions have own argument restrictions
  "TCH001",
  "TCH002",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["wax", "beekeepy"]
