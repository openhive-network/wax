[package]
name = "wax_core"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0"
prost = "0.13"
prost-reflect = { version = "0.16", features = ["serde"] }
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"
