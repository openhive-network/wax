[package]
name = "hiveio-wax"
version = "0.0.0"
edition = "2024"
description = "Hive blockchain protocol library for Rust — transaction building, signing and protocol types. Name reserved for the official Hive `wax` project; implementation in progress."
license = "MIT"
repository = "https://gitlab.syncad.com/hive/wax"
homepage = "https://gitlab.syncad.com/hive/wax"
readme = "README.md"
keywords = ["hive", "blockchain", "wax", "crypto"]
categories = ["cryptography::cryptocurrencies"]
# The published crate ships the prelinked native bundle (see
# prelink_bundle.sh) instead of the C++ sources it was built from.
include = [
    "src/**",
    "proto/**",
    "build.rs",
    "lib/libwax_native.a",
    "README.md",
]

[lib]
name = "wax"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cxx = "=1.0.194"
paste = "1"
pbjson = "0.7"
percent-encoding = "2"
prost = "0.13"
prost-reflect = { version = "0.16", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
beekeeper_rust = { path = "../crates/beekeeper/programs/beekeeper/beekeeper_rust" }
tokio = { version = "1", features = ["macros", "rt"] }

[build-dependencies]
cmake = "0.1"
cxx-build = "=1.0.194"