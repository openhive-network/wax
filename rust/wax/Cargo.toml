[package]
name = "hiveio-wax"
version = "0.0.0"
edition = "2024"
description = "Hive blockchain protocol library for Rust — transaction building, signing and protocol types. Name reserved for the official Hive `wax` project; implementation in progress."
license = "MIT"
repository = "https://gitlab.syncad.com/hive/wax"
homepage = "https://gitlab.syncad.com/hive/wax"
readme = "README.md"
keywords = ["hive", "blockchain", "wax", "crypto"]
categories = ["cryptography::cryptocurrencies"]
# The published crate ships the prelinked native bundle (see
# prelink_bundle.sh) instead of the C++ sources it was built from.
include = [
    "src/**",
    "proto/**",
    "build.rs",
    "lib/libwax_native.a",
    "README.md",
]

[lib]
name = "wax"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cxx = "=1.0.194"
# Already a transitive dependency of reqwest; only `join_all` is used.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Proc-macro companion (the #[hive_api] attribute). Pinned exactly: the
# generated code and this crate's items must move in lockstep.
hiveio-wax-macros = { version = "=0.0.0", path = "../wax_macros" }
pbjson = "0.7"
percent-encoding = "2"
prost = "0.13"
prost-reflect = { version = "0.16", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Already a transitive dependency of reqwest; the health checker needs the
# broadcast channel (events), the timer driving `HealthChecker::run` and
# `tokio::spawn` behind `HealthChecker::spawn`.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
url = "2"

[dev-dependencies]
# Extracted from the beekeeper project's GitLab generic package registry by
# ../fetch_beekeeper.sh (run it once before any cargo command). Deliberately
# path-only: cargo strips path-only dev-dependencies from the published
# manifest, so beekeeper never ships with the wax crate.
hiveio-beekeeper = { path = "../crates/hiveio-beekeeper" }
# `test-util` powers the paused-clock scheduling tests of the health checker.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[build-dependencies]
cmake = "0.1"
cxx-build = "=1.0.194"
