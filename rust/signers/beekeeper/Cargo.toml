[package]
name = "hiveio-wax-signers-beekeeper"
version = "0.0.0"
edition = "2024"
description = "Beekeeper signer companion of the hiveio-wax crate: bridges a Beekeeper wallet to wax's SignatureProvider trait. Name reserved for the official Hive project; implementation in progress."
license = "MIT"
repository = "https://gitlab.syncad.com/hive/wax"
homepage = "https://gitlab.syncad.com/hive/wax"
keywords = ["hive", "blockchain", "wax", "beekeeper"]
categories = ["cryptography::cryptocurrencies"]

[lib]
name = "wax_signers_beekeeper"

[dependencies]
# The path points at the crate ../../fetch_beekeeper.sh extracts from the
# beekeeper project's GitLab generic package registry (run it once before any
# cargo command). The version requirement exists only because `cargo package`
# rejects a non-dev path dependency without one — hiveio-wax's beekeeper
# dev-dependency stays path-only and is stripped from the published manifest,
# but this is a regular dependency and must carry a version.
#
# cargo set-version leaves it alone (beekeeper is not a workspace member), so a
# hand-pinned value drifts the moment beekeeper publishes a newer build than
# fetch_beekeeper.sh installs, breaking resolution against the freshly fetched
# path crate. fetch_beekeeper.sh therefore rewrites this to `=<fetched
# version>` on every run — never edit the version by hand.
hiveio-beekeeper = { path = "../../crates/hiveio-beekeeper", version = "=1.28.6-rc14-20260722131040" }
# The exact requirement must always equal ../../wax's version, or cargo
# rejects the path crate as a non-matching candidate. generate_version.sh
# (cargo set-version --workspace) rewrites it in lockstep, like the
# hiveio-wax-macros requirement inside wax itself — never bump it by hand.
hiveio-wax = { path = "../../wax", version = "=0.0.0" }
thiserror = "2"
