stages:
  - build
  - static_code_analysis
  - test
  - deploy

include:
  - template: Workflows/Branch-Pipelines.gitlab-ci.yml
  - project: 'hive/common-ci-configuration'
    ref: bad5cbd873d9a990564720acb59916e50f733347
    file:
      - '/templates/npm_projects.gitlab-ci.yml'
      - '/templates/wasm_build.gitlab-ci.yml'
      - '/templates/python_projects.gitlab-ci.yml'
      - '/templates/docker_image_jobs.gitlab-ci.yml'


variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  # only build steps needs to have access to the hive submodule
  GIT_SUBMODULE_STRATEGY: normal
  # Python 3.14 compatibility - allow PyO3-based packages to build
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  # uses registry.gitlab.syncad.com/hive/wax/ci-base-image:ubuntu24.04-py3.14-1
  CI_BASE_IMAGE_TAG: "@sha256:a2f4d9505c64d8c9c7e954de7efb12b5a313e8a839e86ba6000cf84b624608e0"
  CI_BASE_IMAGE: "registry.gitlab.syncad.com/hive/wax/ci-base-image${CI_BASE_IMAGE_TAG}"
  # Python 3.12 image for API generation (pydantic-core doesn't support Python 3.14 yet)
  # TODO: Move to common-ci-configuration when Python 3.12 ci-base-image is added there
  CI_BASE_IMAGE_PY312: "registry.gitlab.syncad.com/hive/hive/ci-base-image:ubuntu24.04-1"

  # uses registry.gitlab.syncad.com/hive/wax/wax-python-runtime:ubuntu24.04-1
  WAX_PYTHON_RUNTIME_IMAGE_TAG: sha256:d40e70aa29c2b9c407735c0ae2a2e52f1cd85f1ce0a0a58cbe69eb62ab5ce758
  WAX_PYTHON_RUNTIME_IMAGE: registry.gitlab.syncad.com/hive/wax/wax-python-runtime:ubuntu24.04-1

  # uses registry.gitlab.syncad.com/hive/wax/ci-base-image:ubuntu24.04-py3.14-1
  PYTHON_IMAGE_TAG: "${CI_BASE_IMAGE_TAG}"
  PYTHON_IMAGE: "${CI_BASE_IMAGE}"

  # PIP INDEX URL's
  FIRST_INDEX: "https://gitlab.syncad.com/api/v4/projects/362/packages/pypi/simple"
  SECOND_INDEX: "https://gitlab.syncad.com/api/v4/projects/434/packages/pypi/simple"
  THIRD_INDEX: "https://gitlab.syncad.com/api/v4/projects/198/packages/pypi/simple"

  # colors:
  TXT_BLUE: "\e[1;34m"
  TXT_CLEAR: "\e[0m"
  NPM_TOKEN: $CI_JOB_TOKEN

  DATA_CACHE_HIVE_PREFIX: "/cache/replay_data_hive"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m

  # Common paths for TS package jobs
  TS_SOURCE_DIR: "${CI_PROJECT_DIR}/ts"
  TS_DIST_DIR: "${CI_PROJECT_DIR}/ts/wasm/dist"

image: "${CI_BASE_IMAGE}"

# Cross-runner compatible before_script for jobs using built package tarball
# Computes the local path from the filename instead of using absolute path from dotenv
.cross_runner_unpack_tarball:
  before_script:
    - !reference [.npm_based_job_base, before_script]
    # Compute local path from filename (cross-runner compatible)
    - PACKAGE_TGZ_PATH="${TS_DIST_DIR}/$(basename ${BUILT_PACKAGE_PATH})"
    - echo -e "\e[0Ksection_start:$(date +%s):package_tgz_unpack[collapsed=true]\r\e[0KAttempting to unpack ${PACKAGE_TGZ_PATH}"
    - cd "${CI_PROJECT_DIR}"
    - tar -xf "${PACKAGE_TGZ_PATH}" -C "${TS_SOURCE_DIR}" --strip-components=1
    - echo -e "\e[0Ksection_end:$(date +%s):package_tgz_unpack\r\e[0K"

default:
  tags:
    - public-runner-docker

build_python_api_packages:
  extends: .configuration_template
  stage: build
  image: "${CI_BASE_IMAGE_PY312}"  # Use Python 3.12 - pydantic-core doesn't support Python 3.14 yet
  variables:
      API_GENERATION_DIR: "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation"
      PYPROJECT_DIR: "${API_GENERATION_DIR}/api_generation"
  before_script:
    - !reference [.configuration_template, before_script]
    # Install Node.js/npm for api_generation (not included in Python 3.12 base image)
    - curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
    - sudo apt-get install -y nodejs
  script:
    - echo -e "${TXT_BLUE}Building Python API packages...${TXT_CLEAR}"
    - ${CI_PROJECT_DIR}/python/scripts/build_api_packages.sh
  artifacts:
    paths:
      - "${API_GENERATION_DIR}/database_api"
      - "${API_GENERATION_DIR}/network_broadcast_api"
      - "${API_GENERATION_DIR}/rc_api"
      - "build_wheel.env"
    reports:
        dotenv: "build_wheel.env"

deploy_python_api_packages_to_gitlab:
  stage: deploy
  needs:
    - job: build_python_api_packages
      artifacts: true
  extends: .deploy_wheel_to_gitlab_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation/api_generation"
    API_PACKAGES_REGISTRY: "https://gitlab.syncad.com/api/v4/projects/198/packages/pypi"
    DATABASE_API_DIR: "${PYPROJECT_DIR}/../database_api"
    NETWORK_BROADCAST_API_DIR: "${PYPROJECT_DIR}/../network_broadcast_api"
    RC_API_DIR: "${PYPROJECT_DIR}/../rc_api"
  script: # Overrides the script from the template because we need to hardcode the repository URL as we push it to the hive package registry
    - echo -e "${TXT_BLUE}Deploying python api packages to the GitLab PyPI registry...${TXT_CLEAR}"
    - ls -al
    - poetry -C "${DATABASE_API_DIR}" version # version of the database and network_broadcast and rc_api is the same
    - poetry -C "${DATABASE_API_DIR}" config repositories.gitlab "${API_PACKAGES_REGISTRY}"
    - poetry -C "${DATABASE_API_DIR}" config http-basic.gitlab gitlab-ci-token "${CI_JOB_TOKEN}"
    - poetry -C "${DATABASE_API_DIR}" publish --skip-existing --repository gitlab
    - poetry -C "${NETWORK_BROADCAST_API_DIR}" publish --skip-existing --repository gitlab
    - poetry -C "${RC_API_DIR}" publish --skip-existing --repository gitlab
  when: on_success

build_wheel:
  extends: .build_wheel_template
  needs:
    - job: build_python_api_packages
      artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
    GIT_SUBMODULE_STRATEGY: recursive
  stage: build
  script:
    - ./python/scripts/build_wax.sh 1
  artifacts:
    when: always
    paths:
      - "${PYPROJECT_DIR}/dist/"
      - "${PYPROJECT_DIR}/.build/logs/"
      - "${PYPROJECT_DIR}/wax/*.so"
      - "build_wheel.env"
      - "${PYPROJECT_DIR}/wax/_private/proto"
      - "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation/database_api"
      - "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation/network_broadcast_api"
      - "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation/rc_api"
    expire_in: 1 week
    reports:
      dotenv: "build_wheel.env"

wax_wasm_proto_tsc_generation:
  extends: .npm_build_template
  stage: build
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax"
    GIT_SUBMODULE_STRATEGY: recursive
    REPLACE_DOC_URL_ENV: "GEN_DOC_URL"
    REPLACE_FILE_PATH: "${SOURCE_DIR}/README.md"

  artifacts:
    when: always
    paths:
      - "${DIST_DIR}/*.tgz"  # Built package
      - "${SOURCE_DIR}/packages/*/dist"
      - "${REPLACE_FILE_PATH}"  # Modified README
      - "${CI_PROJECT_DIR}/ts/wasm/lib/proto" # For documentation generator
      - "${CI_PROJECT_DIR}/ts/wasm/lib/build_wasm" # For documentation generator
      - "${DIST_DIR}/lib" # For Node.js tests
      - "${CI_PROJECT_DIR}/ts/wasm/build_wasm/*.log"
    reports:
      dotenv:
        - "${SOURCE_DIR}/gen_doc.env"  # contains URL to generated documentation pointed by `GEN_DOC_URL` variable
        - "${SOURCE_DIR}/built_package_info.env"  # contains path to produced tgz
        - "${SOURCE_DIR}/built_package_version_info.env"  # contains information related to generated package version and git revision

  tags:
    - public-runner-docker

wax_wasm_build_tests:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  script:
    - cd "${SOURCE_DIR}"
    - npm run build:test
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/ts/wasm/dist/assets"
      - "$CI_PROJECT_DIR/ts/wasm/dist/detailed"
      - "$CI_PROJECT_DIR/ts/wasm/dist/index.spec.*"

    when: always
    expire_in: 1 week

  tags:
    - public-runner-docker

generate_docs:
  stage: build
  extends: .npm_based_job_base
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"

  script:
    - scripts/generate_api_docs.sh "${CI_PROJECT_URL}" "${CI_COMMIT_SHA}"

  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true

  artifacts:
    paths:
      - "${DIST_DIR}/docs"

    when: always
    expire_in: 1 week

pre_commit_checks:
  stage: static_code_analysis
  extends: .pre_commit_checks_template
  needs:
    - job: build_wheel
      artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
    API_PACKAGES_DIR: "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation"
  before_script:
    - cd "${PYPROJECT_DIR}"
    - !reference [.configuration_template, before_script]
    - poetry lock --no-update 2>/dev/null || poetry lock  # regenerate lock if needed
    - poetry install --no-root
    - pip install --index-url $FIRST_INDEX --extra-index-url $SECOND_INDEX ${API_PACKAGES_DIR}/database_api/dist/*.whl
    - pip install --index-url $FIRST_INDEX --extra-index-url $SECOND_INDEX ${API_PACKAGES_DIR}/network_broadcast_api/dist/*.whl
    - pip install --index-url $FIRST_INDEX --extra-index-url $SECOND_INDEX ${API_PACKAGES_DIR}/rc_api/dist/*.whl
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - python/poetry.lock

push_to_wiki:
  extends: .npm_push_doc_template
  stage: deploy
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    WIKI_PUSH_TOKEN: "$WIKI_PUSH_TOKEN"
    DIST_DIR: "${TS_DIST_DIR}"

  needs:
    - job: generate_docs
      artifacts: true
    - job: wax_wasm_proto_tsc_generation
      artifacts: true

.runtime_like_python_env:
  stage: test
  extends: .configuration_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  needs:
    - job: build_wheel
      artifacts: true
  before_script:
    - !reference [.configuration_template, before_script]
    - pip install --index-url $FIRST_INDEX --extra-index-url $SECOND_INDEX --extra-index-url $THIRD_INDEX ${PYPROJECT_DIR}/dist/*.whl
    - pip list

.test_python_env:
  extends: .runtime_like_python_env
  before_script:
    - !reference [.runtime_like_python_env, before_script]
    - poetry -C "${PYPROJECT_DIR}" lock --no-update 2>/dev/null || poetry -C "${PYPROJECT_DIR}" lock  # regenerate lock if needed
    - poetry -C "${PYPROJECT_DIR}" install --no-root  # install dependencies for tests
    - pip list

test_importing_wax:
  extends: .runtime_like_python_env
  script:
    - echo -e "${TXT_BLUE}Testing...${TXT_CLEAR}"
    - cd ..  # needed to import installed package instead of local one
    - python3 -c "import wax; print(wax.__version__); exit()"

test_wax_protobuf_python:
  extends: .test_python_env
  # Allow failure: online test requires api.fake.openhive.network which may be unavailable
  allow_failure: true
  script:
    - echo -e "${TXT_BLUE}Testing wax with proto ...${TXT_CLEAR}"
    - ${PYPROJECT_DIR}/tests/run_tests.sh
  artifacts:
    reports:
      junit: python/tests/report.xml
    paths:
      - $PYPROJECT_DIR/mock-server.log

test_wax_protobuf_python_pattern:
  extends: .test_python_env
  needs:
    - job: build_wheel
      artifacts: true
  script:
    - echo -e "${TXT_BLUE}Testing generated proto files with patterns ...${TXT_CLEAR}"
    - diff --brief --recursive --color=never --no-ignore-file-name-case --no-dereference  $CI_PROJECT_DIR/python/protobuf_patterns/ $CI_PROJECT_DIR/python/wax/_private/proto/
  artifacts:
    paths:
      - $CI_PROJECT_DIR/python/wax/_private/proto/

    when: always
    expire_in: 1 week

test_wax_protobuf_python_examples:
  extends: .runtime_like_python_env
  script:
    - echo -e "${TXT_BLUE}Testing visitor of wax protobuf...${TXT_CLEAR}"
    - cd $CI_PROJECT_DIR
    - ./examples/python/run_example.sh

test_wax_wasm:
  extends:
    - .npm_test_template
    - .cross_runner_unpack_tarball
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
    - job: wax_wasm_build_tests
      artifacts: true
  tags:
    - public-runner-docker
  parallel:
    matrix:
      - TEST_GROUPS: [
        --project=wax_testsuite,
        --project=healthchecker_tests,
        --project=wax_utils --project=wax_non_encrypted_operations --project=wax_mock_tests --project=wax_encrypted_operations --project=wax_custom_chain_online_tx --project=wax_testsuite_custom_chain_options,
        --project=wax_regression_tests --project=wax_operation_factories --project=wax_testsuite_protocol_benchmarks,
      ]
  script:
    - cd ts
    - npm run test -- $TEST_GROUPS

test_wax_wasm_proto_pattern:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  script:
    - diff --brief --recursive --color=never --no-ignore-file-name-case --no-dereference "$CI_PROJECT_DIR/ts/protobuf_patterns/proto" "$CI_PROJECT_DIR/ts/wasm/dist/lib/proto"
    - tar -tf "${PACKAGE_TGZ_PATH}" > "$CI_PROJECT_DIR/ts/wasm/dist/npm-pack.gen"
    - diff --brief --color=never --no-dereference "$CI_PROJECT_DIR/ts/wasm/dist/npm-pack.gen" "$CI_PROJECT_DIR/ts/protobuf_patterns/npm-pack.out"
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/ts/wasm/dist/npm-pack.gen"
      - "$CI_PROJECT_DIR/ts/wasm/dist/lib/proto/"

    when: always
    expire_in: 1 week
  tags:
    - public-runner-docker

test_wax_wasm_examples:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    GIT_SUBMODULE_STRATEGY: "normal"
  script:
    - cd "${SOURCE_DIR}"
    - npm run examples
  tags:
    - public-runner-docker

test_wax_wasm_signature_extension:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    GIT_SUBMODULE_STRATEGY: "normal"
  script:
    - cd "${SOURCE_DIR}"
    - npm run examples:signature-extension
  tags:
    - public-runner-docker

.deploy_wheel_needs: &deploy_wheel_needs
  needs:
    - job: test_importing_wax
    - job: test_wax_protobuf_python
    - job: build_wheel
      artifacts: true

deploy_wheel_to_gitlab:
  stage: deploy
  extends: .deploy_wheel_to_gitlab_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  <<: *deploy_wheel_needs
  when: on_success

deploy_wheel_to_pypi:
  extends: .deploy_wheel_to_pypi_template
  stage: deploy
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  <<: *deploy_wheel_needs

deploy_wax_wasm_dev_package:
  extends:
    - .npm_deploy_package_template
    - .cross_runner_unpack_tarball
  stage: deploy
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    NPM_PACKAGE_SCOPE: "@hiveio"
    GIT_SUBMODULE_STRATEGY: "normal"
  needs:
    - job: test_wax_wasm_examples
    - job: test_wax_wasm
    - job: test_wax_wasm_proto_pattern
    - job: push_to_wiki
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  tags:
    - public-runner-docker

deploy_wax_wasm_production_public_npm:
  extends:
    - .registry_npmjs_org_deploy_package_template
    - .cross_runner_unpack_tarball
  stage: deploy
  variables:
    NPM_PUBLISH_TOKEN: "$INTERNAL_HIDDEN_PUBLISH_TOKEN"
    NPM_PACKAGE_NAME: "wax"
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    GIT_SUBMODULE_STRATEGY: "normal"
  needs:
    - job: test_wax_wasm_examples
    - job: test_wax_wasm
    - job: test_wax_wasm_proto_pattern
    - job: push_to_wiki
    - job: wax_wasm_proto_tsc_generation
      artifacts: true

  tags:
    - public-runner-docker

test_helpy:
  extends: .test_python_env
  script:
    - echo -e "${TXT_BLUE}Launching tests...${TXT_CLEAR}"
    - cd ${PYPROJECT_DIR}/tests/helpy_test
    - python3 -m pytest -n auto --durations 0 --junitxml=${CI_PROJECT_DIR}/report.xml
    - echo -e "${TXT_BLUE}Tests succesfully...${TXT_CLEAR}"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: $CI_PROJECT_DIR/report.xml

.build_python_docs_env:
  extends: .runtime_like_python_env
  stage: build
  before_script:
    - !reference [.runtime_like_python_env, before_script]
    - poetry -C "${PYPROJECT_DIR}" lock --no-update 2>/dev/null || poetry -C "${PYPROJECT_DIR}" lock  # regenerate lock if needed
    - poetry -C "${PYPROJECT_DIR}" install --no-root --only docs # install dependencies for docs
    - pip list

.python_docs_variables:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      variables:
        # subpath to branches content for preview
        CURRENT_CONTENT_PATH: "preview/${CI_COMMIT_REF_SLUG}"
    - variables:
        # default branch subpath
        CURRENT_CONTENT_PATH: $GITLAB_PAGES_DEFAULT_BRANCH_PATH
  variables:
    GITLAB_PAGES_DEFAULT_BRANCH_PATH: "default/"
    CURRENT_URL: $CURRENT_CONTENT_PATH
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
    PAGES_ENV_NAME: "pages/${CI_COMMIT_REF_SLUG}"
    PAGES_BASE_DIR: "${CI_PROJECT_DIR}/public"
    PAGES_CONTENT_PATH: "${PAGES_BASE_DIR}/${CURRENT_CONTENT_PATH}"
    DOCS_BUILD_TARGET_DIR: "${PYPROJECT_DIR}/site"

build_python_docs:
  extends:
    - .build_python_docs_env
    - .python_docs_variables
  script:
    - cd $PYPROJECT_DIR
    - mkdocs build --site-dir $DOCS_BUILD_TARGET_DIR
  artifacts:
    paths:
      - $DOCS_BUILD_TARGET_DIR
    when: always
    expire_in: 1 week

.python_docs_deployment_base:
  extends: .python_docs_variables
  stage: deploy
  cache:
    # using cache is the workaround for keeping multiple deployments (pages for multiple branches at the same time)
    # due to GitLab "Parallel Deployments" being a premium feature: https://docs.gitlab.com/user/project/pages/#parallel-deployments
    key: gitlab-pages
    paths: [ public ]
  artifacts:
    paths: [ public ]
  tags:  # has to be a single runner or cache should be shared between multiple runners
    - data-cache-storage

deploy_python_docs:
  pages: true
  extends: .python_docs_deployment_base
  needs:
    - job: build_python_docs
      artifacts: true
  variables:
    PAGES_URL: "${CI_PAGES_URL}/${CURRENT_URL}"
  script:
    - echo "Directory used for gitlab pages publishing ${PAGES_CONTENT_PATH}"
    - rm -rf $PAGES_CONTENT_PATH
    - mkdir -p $PAGES_CONTENT_PATH
    - mv $DOCS_BUILD_TARGET_DIR/* $PAGES_CONTENT_PATH
    - echo "/ /${GITLAB_PAGES_DEFAULT_BRANCH_PATH} 302" > ${PAGES_BASE_DIR}/_redirects  # redirect gitlab pages url like https://wax-cb93b7.pages.syncad.com/ to https://wax-cb93b7.pages.syncad.com/default/
    - echo "Documentation will be available at ${PAGES_URL} or through Operate/Environments view by pointing ${PAGES_ENV_NAME}"
  environment:
    name: $PAGES_ENV_NAME
    action: start
    url: $PAGES_URL
    on_stop: clean_python_docs_preview

clean_python_docs_preview:
  extends: .python_docs_deployment_base
  script:
    - echo "Removing ${PAGES_CONTENT_PATH}"
    - rm -rf $PAGES_CONTENT_PATH
  environment:
    name: $PAGES_ENV_NAME
    action: stop
  when: manual
  allow_failure: true

build_and_publish_wax_doc_snippets_image:
  extends: .docker_image_builder_job_template
  needs:
    - job: build_wheel
  stage: build
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - ${PYPROJECT_DIR}/scripts/build_and_publish_wax_doc_snippets_image.sh "${PYPROJECT_DIR}" "${CI_COMMIT_SHA}"
  tags:
  - public-runner-docker
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never

test_wax_doc_snippets_image:
  image: docker:24.0.2
  stage: test
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build_and_publish_wax_doc_snippets_image
  services:
    - docker:dind
  script:
    - docker pull "${CI_REGISTRY_IMAGE}/wax-python-runtime-codespaces:${CI_COMMIT_SHA}"
    - docker run --rm "${CI_REGISTRY_IMAGE}/wax-python-runtime-codespaces:${CI_COMMIT_SHA}" python -c 'import wax; print(f"Installed hiveoi-wax version - {wax.__version__}"); assert wax.__version__ == "1.27.12rc1"'
  tags:
    - public-runner-docker
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
