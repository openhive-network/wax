stages:
  - prepare
  - build
  - static_code_analysis
  - test_python
  - test
  - deploy

include:
  - template: Workflows/Branch-Pipelines.gitlab-ci.yml
  # hive/hive's common_includes.yml includes common-ci-configuration templates at an older commit.
  # We include hive/hive FIRST, then override with our submodule ref AFTER, so common-ci-configuration version wins.
  - project: 'hive/hive'
    ref: e5b38e2ab6274a1d8e84dc5da3a22f7c3689958d
    file:
      - '/scripts/ci-helpers/common_includes.yml'
      - '/scripts/ci-helpers/hiveio_api_package.gitlab-ci.yml'
  # Override common-ci-configuration templates with our submodule ref (must come AFTER hive/hive include)
  - project: 'hive/common-ci-configuration'
    ref: 13581fecea817f76e96644880f4fb7490c315777
    file:
      - '/templates/npm_projects.gitlab-ci.yml'
      - '/templates/wasm_build.gitlab-ci.yml'
      - '/templates/python_projects.gitlab-ci.yml'
      - '/templates/docker_image_jobs.gitlab-ci.yml'
      - '/templates/verify_submodule_ref.gitlab-ci.yml'
      - '/templates/github_pages.gitlab-ci.yml'


variables:
  TEST_WITH_LATEST_DEPENDENCIES: "false"
  STATIC_ANALYSIS_WITH_LATEST_DEPENDENCIES: "false"
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  # Clone top-level submodules (hive, npm-common-config) but not nested ones.
  # Build jobs that compile from hive source override to 'recursive'.
  GIT_SUBMODULE_STRATEGY: normal
  # Python 3.14 compatibility - allow PyO3-based packages to build
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

  # =============================================================================
  # CI Base Images for Python wheel builds
  # =============================================================================
  # wax ci-base-image includes WAX_BOOST_ROOT with pre-compiled Boost library.
  # Built from common-ci-configuration/ci-base-image (pypa manylinux) with Boost added.
  # Single image supports multiple Python versions via PYTHON_VERSION variable.

  # Base image from common-ci-configuration (used to build wax ci-base-image)
  # uses registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image:pypa_2_28-1, in future update tag to smth like :pypa_2_28-1
  COMMON_CI_BASE_IMAGE_TAG: "2fc9d83726a4fddc681c2b30fbd67701316ba85a"
  COMMON_CI_BASE_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image:${COMMON_CI_BASE_IMAGE_TAG}"

  CI_BASE_IMAGE_TAG: "pypa_2_28-12"
  CI_BASE_IMAGE: "registry.gitlab.syncad.com/hive/wax/ci-base-image:${CI_BASE_IMAGE_TAG}"

  # PIP INDEX URL's
  FIRST_INDEX: "https://gitlab.syncad.com/api/v4/projects/362/packages/pypi/simple"
  SECOND_INDEX: "https://gitlab.syncad.com/api/v4/projects/558/packages/pypi/simple"
  THIRD_INDEX: "https://gitlab.syncad.com/api/v4/projects/198/packages/pypi/simple"

  # colors:
  TXT_BLUE: "\e[1;34m"
  TXT_CLEAR: "\e[0m"
  NPM_TOKEN: $CI_JOB_TOKEN

  DATA_CACHE_HIVE_PREFIX: "/cache/replay_data_hive"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m

  # Common paths for TS package jobs
  TS_SOURCE_DIR: "${CI_PROJECT_DIR}/ts"
  TS_DIST_DIR: "${CI_PROJECT_DIR}/ts/wasm/dist"

image: "${CI_BASE_IMAGE}"

# Cross-runner compatible before_script for jobs using built package tarball
# Computes the local path from the filename instead of using absolute path from dotenv
.cross_runner_unpack_tarball:
  before_script:
    - !reference [.npm_based_job_base, before_script]
    # Compute local path from filename (cross-runner compatible)
    - PACKAGE_TGZ_PATH="${TS_DIST_DIR}/$(basename ${BUILT_PACKAGE_PATH})"
    - echo -e "\e[0Ksection_start:$(date +%s):package_tgz_unpack[collapsed=true]\r\e[0KAttempting to unpack ${PACKAGE_TGZ_PATH}"
    - cd "${CI_PROJECT_DIR}"
    - tar -xf "${PACKAGE_TGZ_PATH}" -C "${TS_SOURCE_DIR}" --strip-components=1
    - echo -e "\e[0Ksection_end:$(date +%s):package_tgz_unpack\r\e[0K"

default:
  tags:
    - public-runner-docker

# Verify that include refs match submodule commits
verify_include_refs:
  extends: .verify_multiple_refs_template
  needs: []
  variables:
    VERIFY_REFS: "hive:hive/hive ts/npm-common-config:hive/common-ci-configuration"

generate_hived_flattened_openapi_definition:
  extends: .node_based_job_base
  stage: build
  script:
    - npm install @apidevtools/json-schema-ref-parser@14.2.1 json-schema-merge-allof@0.8.1
    - touch "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/documentation/flattened.json"
    - node "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation/flatten_swagger.js" "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/documentation/openapi.json" > "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/documentation/openapi_flattened.json"
  artifacts:
    paths:
      - "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/documentation/openapi_flattened.json"
  tags:
    - public-runner-docker

# Build hiveio-api package (build only, test and deploy in later stages)
hiveio_api_package:
  extends: .build_wheel_template
  stage: build
  variables:
    HIVE_PROJECT_ROOT: "${CI_PROJECT_DIR}/hive"
    API_GENERATION_DIR: "${HIVE_PROJECT_ROOT}/libraries/plugins/apis/api_generation"
    PYPROJECT_DIR: "${API_GENERATION_DIR}/api_generation"
    GIT_SUBMODULE_STRATEGY: recursive
  needs:
    - job: generate_hived_flattened_openapi_definition
      artifacts: true
  extends: .hiveio_api_package_template
  # Override after_script to export HIVEIO_API_WHEEL_BUILD_VERSION instead of WHEEL_BUILD_VERSION
  # The parent template's after_script would overwrite build_wheel.env with wrong version
  after_script:
    - HIVEIO_API_WHEEL_BUILD_VERSION=$(poetry -C "${API_GENERATION_DIR}/hiveio_api" version -s)
    - echo "HIVEIO_API_WHEEL_BUILD_VERSION is ${HIVEIO_API_WHEEL_BUILD_VERSION}"
    - echo "HIVEIO_API_WHEEL_BUILD_VERSION=${HIVEIO_API_WHEEL_BUILD_VERSION}" >> build_wheel.env

build_wheel:
  extends: .build_wheel_template
  needs:
    - job: hiveio_api_package
      artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
    GIT_SUBMODULE_STRATEGY: recursive
  stage: build
  image: "${CI_BASE_IMAGE}"
  script:
    - echo "Building wheel for Python ${PYTHON_VERSION}"
    - python3 --version
    - ./python/scripts/build_wax.sh 1
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.14"]
  artifacts:
    when: always
    paths:
      - "${PYPROJECT_DIR}/dist/"
      - "${PYPROJECT_DIR}/.build/logs/"
      - "${PYPROJECT_DIR}/wax/*.so"
      - "build_wheel.env"
      - "${PYPROJECT_DIR}/wax/_private/proto"
      - "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation/hiveio_api"
    expire_in: 1 week
    reports:
      dotenv: "build_wheel.env"
  tags:
    - public-runner-docker

wax_wasm_proto_tsc_generation:
  extends: .npm_build_template
  stage: build
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax"
    GIT_SUBMODULE_STRATEGY: recursive
    REPLACE_DOC_URL_ENV: "GEN_DOC_URL"
    REPLACE_FILE_PATH: "${SOURCE_DIR}/README.md"

  artifacts:
    when: always
    paths:
      - "${DIST_DIR}/*.tgz"  # Built package
      - "${SOURCE_DIR}/packages/*/dist"
      - "${REPLACE_FILE_PATH}"  # Modified README
      - "${CI_PROJECT_DIR}/ts/wasm/lib/proto" # For documentation generator
      - "${CI_PROJECT_DIR}/ts/wasm/lib/build_wasm" # For documentation generator
      - "${DIST_DIR}/lib" # For Node.js tests
      - "${CI_PROJECT_DIR}/ts/wasm/build_wasm/*.log"
    reports:
      dotenv:
        - "${SOURCE_DIR}/gen_doc.env"  # contains URL to generated documentation pointed by `GEN_DOC_URL` variable
        - "${SOURCE_DIR}/built_package_info.env"  # contains path to produced tgz
        - "${SOURCE_DIR}/built_package_version_info.env"  # contains information related to generated package version and git revision

  tags:
    - public-runner-docker

wax_wasm_build_tests:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  stage: build
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  script:
    - cd "${SOURCE_DIR}"
    - npm run build:test
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/ts/wasm/dist/assets"
      - "$CI_PROJECT_DIR/ts/wasm/dist/detailed"
      - "$CI_PROJECT_DIR/ts/wasm/dist/index.spec.*"

    when: always
    expire_in: 1 week

  tags:
    - public-runner-docker

generate_docs:
  stage: build
  extends: .npm_based_job_base
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"

  script:
    - scripts/generate_api_docs.sh "${CI_PROJECT_URL}" "${CI_COMMIT_SHA}"

  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true

  artifacts:
    paths:
      - "${DIST_DIR}/docs"

    when: always
    expire_in: 1 week
  tags:
    - public-runner-docker

pre_commit_checks:
  stage: static_code_analysis
  extends: .pre_commit_checks_template
  needs:
    - job: build_wheel
      artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
    API_PACKAGES_DIR: "${CI_PROJECT_DIR}/hive/libraries/plugins/apis/api_generation"
  before_script:
    - cd "${PYPROJECT_DIR}"
    - !reference [.configuration_template, before_script]
    - !reference [.update_deps_for_static_analysis, script]
    - poetry install --no-root
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - python/poetry.lock
  tags:
    - public-runner-docker

push_to_wiki:
  extends: .npm_push_doc_template
  stage: deploy
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    WIKI_PUSH_TOKEN: "$WIKI_PUSH_TOKEN"
    DIST_DIR: "${TS_DIST_DIR}"

  needs:
    - job: generate_docs
      artifacts: true
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  tags:
    - public-runner-docker

.runtime_like_python_env:
  stage: test_python
  extends: .configuration_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  needs:
    - job: build_wheel
      artifacts: true
  before_script:
    - !reference [.configuration_template, before_script]
    # Install only the wheel matching current Python version (e.g., cp314 for Python 3.14)
    - |
      set -x
      PYTHON_TAG="cp$(python3 -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')"
      WHEEL_FILE=$(ls ${PYPROJECT_DIR}/dist/*-${PYTHON_TAG}-*.whl 2>/dev/null | head -1)
      if [ -z "$WHEEL_FILE" ]; then
        echo "ERROR: No wheel found for Python tag ${PYTHON_TAG}"
        ls -la ${PYPROJECT_DIR}/dist/
        exit 1
      fi
      echo "Installing wheel: $WHEEL_FILE"
      pip install --index-url $FIRST_INDEX --extra-index-url $SECOND_INDEX --extra-index-url $THIRD_INDEX "$WHEEL_FILE"
    - pip list
  tags:
    - public-runner-docker

.test_python_env:
  extends: .runtime_like_python_env
  before_script:
    - !reference [.runtime_like_python_env, before_script]
    - !reference [.update_deps_for_tests, script]
    - poetry -C "${PYPROJECT_DIR}" install --no-root  # install dependencies for tests
    - pip list

.python_test_matrix:
  image: ${CI_BASE_IMAGE}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.14"]

test_importing_wax:
  stage: test_python
  image: quay.io/pypa/manylinux_2_28:2026.01.16-1
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.14"]
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  needs:
    - job: build_wheel
      artifacts: true
  before_script:
    # Set up PATH for the correct Python version from PyPA image
    - export PATH="/opt/python/cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}/bin:$PATH"
    - python3 --version
    # Verify Python version matches PYTHON_VERSION env var
    - |
      ACTUAL_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
      if [ "$ACTUAL_VERSION" != "$PYTHON_VERSION" ]; then
        echo "ERROR: Python version mismatch! Expected $PYTHON_VERSION but got $ACTUAL_VERSION"
        exit 1
      fi
      echo "Python version verified: $ACTUAL_VERSION matches PYTHON_VERSION=$PYTHON_VERSION"
    # Install only the wheel matching current Python version
    - |
      set -x
      PYTHON_TAG="cp${PYTHON_VERSION//./}"
      WHEEL_FILE=$(ls ${PYPROJECT_DIR}/dist/*-${PYTHON_TAG}-*.whl 2>/dev/null | head -1)
      if [ -z "$WHEEL_FILE" ]; then
        echo "ERROR: No wheel found for Python tag ${PYTHON_TAG}"
        ls -la ${PYPROJECT_DIR}/dist/
        exit 1
      fi
      echo "Installing wheel: $WHEEL_FILE"
  script:
    - echo "Testing on PyPA manylinux_2_28 with Python ${PYTHON_VERSION}..."
    - python3 --version
    - pip3 install --index-url $FIRST_INDEX --extra-index-url $SECOND_INDEX --extra-index-url $THIRD_INDEX $WHEEL_FILE
    - cd "$CI_PROJECT_DIR" && pwd # needed to import installed package instead of local one
    - python3 -c "import wax; print(wax.__version__); exit()"
  tags:
    - public-runner-docker

test_wax_protobuf_python:
  extends:
    - .test_python_env
    - .python_test_matrix
  script:
    - echo -e "${TXT_BLUE}Testing wax with proto ...${TXT_CLEAR}"
    - ${PYPROJECT_DIR}/tests/run_tests.sh
  artifacts:
    reports:
      junit: python/tests/report.xml
    paths:
      - $PYPROJECT_DIR/mock-server.log

test_wax_protobuf_python_pattern:
  extends:
    - .test_python_env
    - .python_test_matrix
  needs:
    - job: build_wheel
      artifacts: true
  script:
    - echo -e "${TXT_BLUE}Testing generated proto files with patterns ...${TXT_CLEAR}"
    - diff --brief --recursive --color=never --no-ignore-file-name-case --no-dereference  $CI_PROJECT_DIR/python/protobuf_patterns/ $CI_PROJECT_DIR/python/wax/_private/proto/
  artifacts:
    paths:
      - $CI_PROJECT_DIR/python/wax/_private/proto/

    when: always
    expire_in: 1 week

test_wax_protobuf_python_examples:
  extends:
    - .runtime_like_python_env
    - .python_test_matrix
  script:
    - echo -e "${TXT_BLUE}Testing visitor of wax protobuf...${TXT_CLEAR}"
    - cd $CI_PROJECT_DIR
    - ./examples/python/run_example.sh

test_wax_wasm:
  extends:
    - .npm_test_template
    - .cross_runner_unpack_tarball
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
    - job: wax_wasm_build_tests
      artifacts: true
  tags:
    - public-runner-docker
  parallel:
    matrix:
      - TEST_GROUPS: [
        --project=wax_testsuite,
        --project=healthchecker_tests,
        --project=wax_utils --project=wax_non_encrypted_operations --project=wax_mock_tests --project=wax_encrypted_operations --project=wax_custom_chain_online_tx --project=wax_testsuite_custom_chain_options,
        --project=wax_regression_tests --project=wax_operation_factories --project=wax_testsuite_protocol_benchmarks,
      ]
  script:
    - cd ts
    - npm run test -- $TEST_GROUPS

test_wax_wasm_proto_pattern:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  script:
    - diff --brief --recursive --color=never --no-ignore-file-name-case --no-dereference "$CI_PROJECT_DIR/ts/protobuf_patterns/proto" "$CI_PROJECT_DIR/ts/wasm/dist/lib/proto"
    - tar -tf "${PACKAGE_TGZ_PATH}" > "$CI_PROJECT_DIR/ts/wasm/dist/npm-pack.gen"
    - diff --brief --color=never --no-dereference "$CI_PROJECT_DIR/ts/wasm/dist/npm-pack.gen" "$CI_PROJECT_DIR/ts/protobuf_patterns/npm-pack.out"
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/ts/wasm/dist/npm-pack.gen"
      - "$CI_PROJECT_DIR/ts/wasm/dist/lib/proto/"

    when: always
    expire_in: 1 week
  tags:
    - public-runner-docker

test_wax_wasm_examples:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  script:
    - cd "${SOURCE_DIR}"
    - echo "Checking Playwright browsers:" && pnpm exec playwright install --dry-run || true
    - npm run examples
  tags:
    - public-runner-docker

test_wax_wasm_signature_extension:
  extends:
    - .npm_process_built_package_tarball
    - .cross_runner_unpack_tarball
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  script:
    - cd "${SOURCE_DIR}"
    - npm run examples:signature-extension
  tags:
    - public-runner-docker

.deploy_wheel_needs: &deploy_wheel_needs
  needs:
    - job: test_importing_wax
    - job: test_wax_protobuf_python
    - job: build_wheel
      artifacts: true

deploy_wheel_to_gitlab:
  stage: deploy
  extends: .deploy_wheel_to_gitlab_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  <<: *deploy_wheel_needs
  when: on_success
  tags:
    - public-runner-docker

deploy_wheel_to_pypi:
  extends: .deploy_wheel_to_pypi_template
  stage: deploy
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  <<: *deploy_wheel_needs
  tags:
    - public-runner-docker

deploy_wax_wasm_dev_package:
  extends:
    - .npm_deploy_package_template
    - .cross_runner_unpack_tarball
  stage: deploy
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
    NPM_PACKAGE_SCOPE: "@hiveio"
  needs:
    - job: test_wax_wasm_examples
    - job: test_wax_wasm
    - job: test_wax_wasm_proto_pattern
    - job: push_to_wiki
    - job: wax_wasm_proto_tsc_generation
      artifacts: true
  tags:
    - public-runner-docker

deploy_wax_wasm_production_public_npm:
  extends:
    - .registry_npmjs_org_deploy_package_template
    - .cross_runner_unpack_tarball
  stage: deploy
  variables:
    NPM_PUBLISH_TOKEN: "$INTERNAL_HIDDEN_PUBLISH_TOKEN"
    NPM_PACKAGE_NAME: "wax"
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    DIST_DIR: "${TS_DIST_DIR}"
  needs:
    - job: test_wax_wasm_examples
    - job: test_wax_wasm
    - job: test_wax_wasm_proto_pattern
    - job: push_to_wiki
    - job: wax_wasm_proto_tsc_generation
      artifacts: true

  tags:
    - public-runner-docker

test_helpy:
  extends:
    - .test_python_env
    - .python_test_matrix
  script:
    - echo -e "${TXT_BLUE}Launching tests...${TXT_CLEAR}"
    - cd ${PYPROJECT_DIR}/tests/helpy_test
    - python3 -m pytest -n auto --durations 0 --junitxml=${CI_PROJECT_DIR}/report.xml
    - echo -e "${TXT_BLUE}Tests succesfully...${TXT_CLEAR}"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: $CI_PROJECT_DIR/report.xml
  tags:
    - public-runner-docker

.build_python_docs_env:
  extends: .runtime_like_python_env
  stage: build
  before_script:
    - !reference [.runtime_like_python_env, before_script]
    - poetry -C "${PYPROJECT_DIR}" lock --no-update 2>/dev/null || poetry -C "${PYPROJECT_DIR}" lock  # regenerate lock if needed
    - poetry -C "${PYPROJECT_DIR}" install --no-root --only docs # install dependencies for docs
    - pip list

.python_docs_variables:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      variables:
        # subpath to branches content for preview
        CURRENT_CONTENT_PATH: "preview/${CI_COMMIT_REF_SLUG}"
    - variables:
        # default branch subpath
        CURRENT_CONTENT_PATH: $GITLAB_PAGES_DEFAULT_BRANCH_PATH
  variables:
    GITLAB_PAGES_DEFAULT_BRANCH_PATH: "default/"
    CURRENT_URL: $CURRENT_CONTENT_PATH
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
    PAGES_ENV_NAME: "pages/${CI_COMMIT_REF_SLUG}"
    PAGES_BASE_DIR: "${CI_PROJECT_DIR}/public"
    PAGES_CONTENT_PATH: "${PAGES_BASE_DIR}/${CURRENT_CONTENT_PATH}"
    DOCS_BUILD_TARGET_DIR: "${PYPROJECT_DIR}/site"

build_python_docs:
  extends:
    - .build_python_docs_env
    - .python_docs_variables
  script:
    - cd $PYPROJECT_DIR
    - mkdocs build --site-dir $DOCS_BUILD_TARGET_DIR
  artifacts:
    paths:
      - $DOCS_BUILD_TARGET_DIR
    when: always
    expire_in: 1 week

.python_docs_deployment_base:
  extends: .python_docs_variables
  stage: deploy
  cache:
    # using cache is the workaround for keeping multiple deployments (pages for multiple branches at the same time)
    # due to GitLab "Parallel Deployments" being a premium feature: https://docs.gitlab.com/user/project/pages/#parallel-deployments
    key: gitlab-pages
    paths: [ public ]
  artifacts:
    paths: [ public ]
  tags:  # has to be a single runner or cache should be shared between multiple runners
    - public-runner-docker
    - data-cache-storage

deploy_python_docs:
  pages: true
  extends: .python_docs_deployment_base
  needs:
    - job: build_python_docs
      artifacts: true
  variables:
    PAGES_URL: "${CI_PAGES_URL}/${CURRENT_URL}"
  script:
    - echo "Directory used for gitlab pages publishing ${PAGES_CONTENT_PATH}"
    - rm -rf $PAGES_CONTENT_PATH
    - mkdir -p $PAGES_CONTENT_PATH
    - mv $DOCS_BUILD_TARGET_DIR/* $PAGES_CONTENT_PATH
    - echo "/ /${GITLAB_PAGES_DEFAULT_BRANCH_PATH} 302" > ${PAGES_BASE_DIR}/_redirects  # redirect gitlab pages url like https://wax-cb93b7.pages.syncad.com/ to https://wax-cb93b7.pages.syncad.com/default/
    - echo "Documentation will be available at ${PAGES_URL} or through Operate/Environments view by pointing ${PAGES_ENV_NAME}"
  environment:
    name: $PAGES_ENV_NAME
    action: start
    url: $PAGES_URL
    on_stop: clean_python_docs_preview

clean_python_docs_preview:
  extends: .python_docs_deployment_base
  script:
    - echo "Removing ${PAGES_CONTENT_PATH}"
    - rm -rf $PAGES_CONTENT_PATH
  environment:
    name: $PAGES_ENV_NAME
    action: stop
  when: manual
  allow_failure: true

build_and_publish_wax_doc_snippets_image:
  extends: .docker_image_builder_job_template
  needs:
    - job: build_wheel
  stage: build
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/python"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - ${PYPROJECT_DIR}/scripts/build_and_publish_wax_doc_snippets_image.sh "${CI_COMMIT_SHA}" "${CI_COMMIT_TAG}"
  tags:
  - public-runner-docker
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never

test_wax_doc_snippets_image:
  extends: .docker_image_builder_job_template
  stage: test
  needs:
    - job: build_and_publish_wax_doc_snippets_image
  script:
    - docker pull "${CI_REGISTRY_IMAGE}/wax-python-runtime-codespaces:${CI_COMMIT_TAG}"
    - |
      docker run --rm -e EXPECTED_VERSION="${CI_COMMIT_TAG}" \
        "${CI_REGISTRY_IMAGE}/wax-python-runtime-codespaces:${CI_COMMIT_TAG}" \
        python -c "import wax; import os; expected = os.environ['EXPECTED_VERSION'].replace('-rc', 'rc'); print(f'Installed hiveio-wax version - {wax.__version__}'); assert wax.__version__ == expected, f'Version mismatch: {wax.__version__} != {expected}'"
  tags:
    - public-runner-docker
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never

# =============================================================================
# WAX CI Base Image Build Job
# =============================================================================
# Builds wax ci-base-image that includes WAX_BOOST_ROOT with pre-compiled Boost.
# Built from common-ci-configuration/ci-base-image (pypa manylinux) with Boost added.
# Single image supports multiple Python versions via PYTHON_VERSION variable.
# Manual trigger - only run when Dockerfile.ci changes or manually requested.

build_wax_ci_base_image:
  extends: .docker_image_builder_job_template
  stage: prepare
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - |
      echo "Building wax ci-base-image"
      echo "Base image: ${COMMON_CI_BASE_IMAGE}"
      echo "Target tag: ${CI_REGISTRY_IMAGE}/ci-base-image:${CI_BASE_IMAGE_TAG}"
    - |
      docker build \
        --build-arg BASE_IMAGE="${COMMON_CI_BASE_IMAGE}" \
        -t "${CI_REGISTRY_IMAGE}/ci-base-image:${CI_BASE_IMAGE_TAG}" \
        -f python/docker/Dockerfile.ci .
    - docker push "${CI_REGISTRY_IMAGE}/ci-base-image:${CI_BASE_IMAGE_TAG}"
  tags:
    - public-runner-docker
  rules:
    # Run on Dockerfile.ci changes
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - python/docker/Dockerfile.ci
          - python/scripts/prepare_boost.sh
      when: on_success
    # Manual trigger available
    - when: manual
      allow_failure: true

# =============================================================================
# GitHub Pages Documentation Deployment
# =============================================================================
# Deploys versioned documentation to a dedicated GitHub repository.
# Triggered on develop branch and version tags.
# Requires GITHUB_PAGES_TOKEN CI variable with repo write access.

generate_html_docs:
  extends: .generate_html_docs_template
  variables:
    SOURCE_DIR: "${TS_SOURCE_DIR}"
    PACKAGE_NAME: "@hiveio/wax"
    ENTRY_POINT: "wasm/lib/index.ts"
  needs:
    - job: wax_wasm_proto_tsc_generation
      artifacts: true

deploy_to_github_pages:
  extends: .deploy_github_pages_full_template
  image: "${CI_BASE_IMAGE}"
  variables:
    PROJECT_NAME: "wax"
    TS_DOCS_DIR: "${CI_PROJECT_DIR}/docs-output/ts"
    PY_DOCS_DIR: "${CI_PROJECT_DIR}/python/site"
    EXTRA_DOCS_DIR: "${TS_DIST_DIR}/docs"
  needs:
    - job: generate_html_docs
      artifacts: true
    - job: build_python_docs
      artifacts: true
    - job: generate_docs
      artifacts: true
