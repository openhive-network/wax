[build-system]
requires = ["poetry-core==2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = "2.1.3"
name = "python_examples"
version = "0.0.0"
description = "A simple way to run wax examples."
authors = ["Jakub Ziębiński <ziebinskijakub@gmail.com>"]
packages = [
    { include = "examples" },
]

source = [
    { name = "PyPI", priority = "primary" },
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4"
hiveio-wax = "^2.0.1"
