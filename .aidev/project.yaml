# Profile for hive/wax, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: wax

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/wax"
  id: 419

# A single-branch topology: this is both what work integrates into and what
# ships. `stable` is omitted rather than declared equal to it — declaring
# them equal is a typo, omitting one is a topology. Add `stable:` when this
# project genuinely promotes to a second branch.
# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/denser), so `stable` is omitted and `aidev release`
# never moves develop or master.
branches:
  integration: "aidev/integration"
  # develop is protected and fast-forward only: hand off by merge request, as a
  # linear one-commit-per-change copy (aidev docs/operations/project-handoff.md).
  handoff: "develop"
  handoff_history: "linear"

# How this project's suites execute (#13892): one kind, stated once.
# Every suite (ts, rust, python) runs in one image AIDEV builds itself from
# .aidev/runtime/Dockerfile on the followed base: the emsdk image CI builds the
# TypeScript package in (EMSCRIPTEN_IMAGE_TAG of ts/npm-common-config), plus the
# native toolchain, Rust and Python and the offline ts, crate and Python
# dependencies. A change to the Dockerfile or to an `inputs` file rebuilds it on
# the next run; nothing is re-pinned. `inputs` is every file whose content decides
# what the image bakes. `image` is only the seed pin AIDEV requires beside a
# followed base (the base's digest at adoption); suites never run in it.
# See .aidev/README.md.
environment:
  kind: "container"
  image: "registry.gitlab.syncad.com/hive/common-ci-configuration/emsdk@sha256:80046ab0629fa83efadab83a01ca8ff23ab22f16515df02884644069d5ffd203"
  build: {dockerfile: ".aidev/runtime/Dockerfile", context: "."}
  base: {image: "registry.gitlab.syncad.com/hive/common-ci-configuration/emsdk:5.0.2-10", follow: true}
  inputs:
    - ".aidev/runtime/Dockerfile.dockerignore"
    - "ts/package.json#packageManager"
    - "ts/pnpm-lock.yaml"
    - "ts/pnpm-workspace.yaml"
    - "ts/.npmrc"
    - "ts/npm-common-config/scripts/python/python-test-tools-constraints.py"
    - "ts/npm-common-config/scripts/python/registry_auth.py"
    - "rust/Cargo.lock"
    - "rust/proto_builder/Cargo.lock"
    - "rust/fetch_beekeeper.sh"
    - "python/wax/poetry.lock"
    - "python/wax/pyproject.toml"
    - "python/wax/tests/wax-local-tools/pyproject.toml"
    - "python/test_tools/poetry.lock"
    - "python/test_tools/pyproject.toml"
    - "python/.pre-commit-config.yaml"
    - "python/wax/scripts/prepare_boost.sh"

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Every slot compiles (the wasm build of core/ and hive's protocol; the rust and
# python suites the same C++ natively), so each shares CI's sccache Redis through
# this one-service stack: a relay on an internal network, which keeps the suites
# as offline as --network none otherwise. When Redis does not answer, the suites
# build cold (.aidev/compiler-cache.sh). See "The compiler cache" in .aidev/README.md.
sandbox:
  compose: ".aidev/sccache-relay.compose.yml"
  services: [sccache]
  resource_class: light
  readiness_timeout: 60

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# The TypeScript package is bound in every slot: every step needs the emscripten
# wasm build of core/ + hive's protocol (about a minute), so each slot starts
# with proto/wasm/tsc. `tests` runs the Playwright projects that need no network
# (slots reach nothing but the sccache relay; API calls are answered from recorded responses). There is no linter and no coverage tool in
# ts/, so `static` is the typecheck plus the protobuf pattern check and
# `coverage` runs the tests. full, baseline and canary also bind the Rust suite
# (.aidev/run-rust.sh), the Python suite (.aidev/run-python.sh) and the python314
# suite (run-python.sh on Python 3.14 with CI's pre-commit hooks), blocking like ts,
# in the same image. Each is change-scoped by its `select` (.aidev/select-suite.sh):
# it runs only when the change touches a path its build or tests read, or when the
# change cannot be enumerated (a canary). Their labels are `<slot>-rust`,
# `<slot>-python` and `<slot>-python314` so they never share the ts suite's
# test-results/aidev-<slot>/,
# which run-checks.sh clears when it starts. See .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "proto", "wasm", "tsc", "bundle", "build-tests", "tests"]
    # The approved scope: the offline Playwright projects, in OFFLINE_PROJECTS
    # order. run-checks.sh restricts `tests` to the projects it is given and runs
    # them all when it is given every one, so `args` + `targets` is today's work.
    targets:
      - wax_utils
      - wax_non_encrypted_operations
      - wax_encrypted_operations
      - wax_operation_factories
      - wax_regression_tests
      - wax_mock_tests
      - wax_testsuite_protocol_benchmarks
      - wax_hive_assertion
      - wax_signers_csp
      - wax_custom_chain_online_tx
      - wax_testsuite_custom_chain_options
    artifacts: ["test-results/aidev-quick/"]
  full:
    suites:
      - name: ts
        adapter: command
        args: [".aidev/run-checks.sh", "full", "proto", "wasm", "tsc", "bundle", "proto-pattern", "build-tests", "tests"]
        artifacts: ["test-results/aidev-full/"]
      - name: rust
        adapter: command
        args: [".aidev/run-rust.sh", "full-rust"]
        select: [".aidev/select-suite.sh", "rust"]
        artifacts: ["test-results/aidev-full-rust/"]
        timeout: 1200
      - name: python
        adapter: command
        args: [".aidev/run-python.sh", "full-python"]
        select: [".aidev/select-suite.sh", "python"]
        artifacts: ["test-results/aidev-full-python/"]
        timeout: 1200
      - name: python314
        adapter: command
        args: [".aidev/run-python.sh", "full-python314", "--python", "3.14", "--pre-commit"]
        select: [".aidev/select-suite.sh", "python314"]
        artifacts: ["test-results/aidev-full-python314/"]
        timeout: 1200
  baseline:
    suites:
      - name: ts
        adapter: command
        args: [".aidev/run-checks.sh", "baseline", "proto", "wasm", "tsc", "bundle", "build-tests", "tests"]
        artifacts: ["test-results/aidev-baseline/"]
      - name: rust
        adapter: command
        args: [".aidev/run-rust.sh", "baseline-rust"]
        select: [".aidev/select-suite.sh", "rust"]
        artifacts: ["test-results/aidev-baseline-rust/"]
        timeout: 1200
      - name: python
        adapter: command
        args: [".aidev/run-python.sh", "baseline-python"]
        select: [".aidev/select-suite.sh", "python"]
        artifacts: ["test-results/aidev-baseline-python/"]
        timeout: 1200
      - name: python314
        adapter: command
        args: [".aidev/run-python.sh", "baseline-python314", "--python", "3.14", "--pre-commit"]
        select: [".aidev/select-suite.sh", "python314"]
        artifacts: ["test-results/aidev-baseline-python314/"]
        timeout: 1200
  canary:
    suites:
      - name: ts
        adapter: command
        args: [".aidev/run-checks.sh", "canary", "proto", "wasm", "tsc", "bundle", "proto-pattern", "build-tests", "tests"]
        artifacts: ["test-results/aidev-canary/"]
      - name: rust
        adapter: command
        args: [".aidev/run-rust.sh", "canary-rust"]
        select: [".aidev/select-suite.sh", "rust"]
        artifacts: ["test-results/aidev-canary-rust/"]
        timeout: 1200
      - name: python
        adapter: command
        args: [".aidev/run-python.sh", "canary-python"]
        select: [".aidev/select-suite.sh", "python"]
        artifacts: ["test-results/aidev-canary-python/"]
        timeout: 1200
      - name: python314
        adapter: command
        args: [".aidev/run-python.sh", "canary-python314", "--python", "3.14", "--pre-commit"]
        select: [".aidev/select-suite.sh", "python314"]
        artifacts: ["test-results/aidev-canary-python314/"]
        timeout: 1200
  static:
    adapter: command
    args: [".aidev/run-checks.sh", "static", "proto", "wasm", "tsc", "proto-pattern"]
    artifacts: ["test-results/aidev-static/"]
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "proto", "wasm", "tsc", "bundle", "build-tests", "tests"]
    artifacts: ["test-results/aidev-coverage/"]
  system:
    adapter: command
    args: [".aidev/run-checks.sh", "system", "proto", "wasm", "tsc", "bundle"]
    artifacts: ["test-results/aidev-system/"]

# What quick could run for a change, proposed by .aidev/selector.py (a path table
# over the targets above). `observe` only records the proposal; quick still runs
# the whole approved scope. See .aidev/README.md.
selection:
  quick:
    selector: .aidev/selector.py:select
    mode: observe
    on_empty: no_evidence

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
